[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriarbor"
version = "0.1.0a1"
description = "Certified Block substitution, Port contracts and local verification policies"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
